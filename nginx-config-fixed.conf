# ==============================================================================
# Nginx конфигурация для svoygarage.ru - ИСПРАВЛЕННАЯ И ОПТИМИЗИРОВАННАЯ
# ==============================================================================

# ==============================================================================
# HTTPS (Port 443) - svoygarage.ru (ОСНОВНОЙ ДОМЕН)
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name svoygarage.ru;

    # --------------------------------------------------------------------------
    # SSL сертификаты
    # --------------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/svoygarage.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/svoygarage.ru/privkey.pem;

    # Современные настройки SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS (безопасное принудительное HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --------------------------------------------------------------------------
    # Лимиты и таймауты (для больших файлов)
    # --------------------------------------------------------------------------
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # --------------------------------------------------------------------------
    # Логирование
    # --------------------------------------------------------------------------
    access_log /var/log/nginx/svoygarage_ssl_access.log;
    error_log /var/log/nginx/svoygarage_ssl_error.log;

    # ==============================================================================
    # React Frontend (SPA)
    # ==============================================================================
    location / {
        root /var/www/my-autoparts;
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики (вынесено отдельно, чтобы не пересекаться с location /)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /var/www/my-autoparts;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ==============================================================================
    # WebSocket для /server/ws/ (ПРИОРИТЕТ - ОБРАБАТЫВАЕТСЯ ПЕРВЫМ!)
    # ==============================================================================
    location /server/ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        
        # WebSocket headers - КРИТИЧНО ВАЖНО!
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Очень длинные таймауты для WebSocket keep-alive
        proxy_read_timeout 86400s;  # 24 часа
        proxy_send_timeout 86400s;  # 24 часа
        
        # Отключаем буферизацию для WebSocket
        proxy_buffering off;
    }

    # ==============================================================================
    # API Backend (FastAPI) - ПУТЬ /server/api/
    # ==============================================================================
    location /server/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты для загрузки файлов
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # Буферизация для API
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }

    # ==============================================================================
    # Backend с префиксом /server/ (для всего остального)
    # ==============================================================================
    location /server/ {
        proxy_pass http://127.0.0.1:8080/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # ==============================================================================
    # Прямой доступ к API без префикса /server/ (опционально)
    # ==============================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # ==============================================================================
    # Прямой доступ к WebSocket без префикса /server/ (опционально)
    # ==============================================================================
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Длинные таймауты для WebSocket keep-alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        proxy_buffering off;
    }

    # ==============================================================================
    # Локальные загрузки (старая папка, для совместимости)
    # ==============================================================================
    location /uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

   
    # ==============================================================================
    # Безопасность
    # ==============================================================================
    location ~ /\.(env|git|htaccess|htpasswd|sql|log|bak)$ {
        deny all;
        return 404;
    }
}

# ==============================================================================
# HTTPS (Port 443) - по IP-адресу
# ==============================================================================
