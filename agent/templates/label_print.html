<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Label</title>
    <style>
      /* Печать без полей */
      @page {
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .label {
        /* Типовой компакт-формат; при необходимости подстройте под ваш принтер. */
        width: 80mm;
        min-height: 45mm;
        box-sizing: border-box;
        padding: 6mm 4mm;
        border: 1px solid #000;
      }

      .row {
        margin-bottom: 2.2mm;
      }

      .title {
        font-size: 9pt;
        font-weight: 700;
        line-height: 1.1;
      }

      .value {
        font-size: 12pt;
        font-weight: 400;
        line-height: 1.1;
        word-break: break-word;
      }

      .value.small {
        font-size: 10pt;
      }

      .no-margin {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="label">
      <div class="row">
        <div class="title">Бренд</div>
        <div class="value">{{brand}}</div>
      </div>

      <div class="row">
        <div class="title">Артикул</div>
        <div class="value">{{article}}</div>
      </div>

      <div class="row">
        <div class="title">Внутренний код</div>
        <div class="value small">{{internal_code}}</div>
      </div>

      <div class="row" style="margin-bottom: 0;">
        <div class="title">Адресное хранение</div>
        <div class="value small">{{storage_address}}</div>
      </div>
    </div>
  </body>
</html>
