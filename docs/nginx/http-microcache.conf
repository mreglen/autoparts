# ==============================================================================
# Microcache для публичного API (блок http {} в nginx.conf)
# Скопировать в /etc/nginx/snippets/svoygarage-microcache.conf и подключить:
#   include /etc/nginx/snippets/svoygarage-microcache.conf;
#
# На сервере создать каталог кэша:
#   sudo mkdir -p /var/cache/nginx/sg_api /var/cache/nginx/sg_page_check /var/cache/nginx/sg_prerender
#   sudo chown www-data:www-data /var/cache/nginx/sg_api /var/cache/nginx/sg_page_check /var/cache/nginx/sg_prerender
# ==============================================================================

proxy_cache_path /var/cache/nginx/sg_api levels=1:2 keys_zone=sg_api_cache:16m max_size=128m inactive=30m use_temp_path=off;
proxy_cache_path /var/cache/nginx/sg_page_check levels=1:2 keys_zone=sg_page_check_cache:4m max_size=16m inactive=10m use_temp_path=off;
proxy_cache_path /var/cache/nginx/sg_prerender levels=1:2 keys_zone=sg_prerender_cache:8m max_size=64m inactive=30m use_temp_path=off;
