# ==============================================================================
# Фрагмент для блока http {} в /etc/nginx/nginx.conf
# Скопировать в /etc/nginx/snippets/svoygarage-bot-map.conf и подключить:
#   include /etc/nginx/snippets/svoygarage-bot-map.conf;
# ==============================================================================

map $http_user_agent $is_search_bot {
    default 0;
    ~*(YandexBot|YandexAccessibilityBot|YandexRenderResourcesBot|YandexImages|YandexPagechecker|YandexWebmaster|YandexMarket|YandexMetrika|Googlebot|bingbot|Applebot|facebookexternalhit|Twitterbot|LinkedInBot|Slurp|DuckDuckBot) 1;
}
