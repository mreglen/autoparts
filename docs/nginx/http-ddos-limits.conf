# ==============================================================================
# Фрагмент для блока http {} в /etc/nginx/nginx.conf
# Скопировать в /etc/nginx/snippets/svoygarage-ddos-limits.conf и подключить:
#   include /etc/nginx/snippets/svoygarage-ddos-limits.conf;
# ==============================================================================

limit_req_zone $binary_remote_addr zone=sg_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sg_api_heavy:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=sg_auth:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=sg_ws:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sg_conn:10m;
