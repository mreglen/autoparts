# ==============================================================================
# Nginx конфигурация для svoygarage.ru
# Путь на сервере: /etc/nginx/sites-available/svoygarage
#
# Перед reload:
#   1. Backend с GET /api/public/page-check
#   2. Frontend build в /var/www/my-autoparts (включая 404.html)
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ==============================================================================
# HTTPS (Port 443) - svoygarage.ru (ОСНОВНОЙ ДОМЕН)
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name svoygarage.ru;

    ssl_certificate /etc/nginx/ssl/svoygarage.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/svoygarage.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    access_log /var/log/nginx/svoygarage_ssl_access.log;
    error_log /var/log/nginx/svoygarage_ssl_error.log;

    # --------------------------------------------------------------------------
    # SEO: HTML с title товара для поисковых роботов (см. docs/nginx-seo-part-pages.md)
    # --------------------------------------------------------------------------
    location = /_internal/part-prerender {
        internal;
        # path передаётся в query при rewrite (см. location ~ ^/part/)
        proxy_pass http://127.0.0.1:8080/api/public/part-prerender$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    location ~ ^/part/ {
        root /var/www/my-autoparts;
        set $bot_prerender 0;
        if ($http_user_agent ~* "(YandexBot|YandexAccessibilityBot|YandexRenderResourcesBot|Googlebot|bingbot|Applebot|facebookexternalhit|Twitterbot|LinkedInBot|Slurp|DuckDuckBot)") {
            set $bot_prerender 1;
        }
        if ($bot_prerender = 1) {
            rewrite ^ /_internal/part-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ @spa;
    }

    # --------------------------------------------------------------------------
    # Проверка SPA-URL через backend (HTTP 404 для несуществующих страниц)
    # --------------------------------------------------------------------------
    location = /_internal/page-check {
        internal;
        # path передаётся в query из auth_request (см. @spa)
        proxy_pass http://127.0.0.1:8080/api/public/page-check$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # React Frontend (SPA)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/my-autoparts;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        # path=$request_uri — иначе backend получит /_internal/page-check и везде будет 403
        auth_request /_internal/page-check?path=$request_uri;
        # auth_request при 404 от backend отдаёт клиенту 403 — перенаправляем на 404.html
        error_page 401 403 =404 /404.html;
        root /var/www/my-autoparts;
        try_files /index.html =404;
    }

    location = /404.html {
        root /var/www/my-autoparts;
        internal;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /var/www/my-autoparts;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------------------------
    # WebSocket чат
    # --------------------------------------------------------------------------
    location /server/ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # WebSocket агента печати (ВАЖНО: до location /server/api/)
    location /server/api/printers/ws {
        proxy_pass http://127.0.0.1:8080/api/printers/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /server/uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /server/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }

    location /server/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # WebSocket агента печати (без /server, опционально)
    location /api/printers/ws {
        proxy_pass http://127.0.0.1:8080/api/printers/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(env|git|htaccess|htpasswd|sql|log|bak)$ {
        deny all;
        return 404;
    }
}

