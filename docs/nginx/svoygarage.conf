# ==============================================================================
# Nginx конфигурация для svoygarage.ru
# Путь на сервере: /etc/nginx/sites-available/svoygarage
#
# Перед reload:
#   1. Подключить map ботов в http {}:
#        include /etc/nginx/snippets/svoygarage-bot-map.conf;
#      (см. docs/nginx/http-bot-map.conf)
#   2. Подключить DDoS limit zones в http {}:
#        include /etc/nginx/snippets/svoygarage-ddos-limits.conf;
#   2b. Microcache публичного API (см. docs/nginx/http-microcache.conf):
#        include /etc/nginx/snippets/svoygarage-microcache.conf;
#   2c. Brotli (опционально, после apt install модуля):
#        include /etc/nginx/snippets/svoygarage-brotli.conf;
#      (см. docs/nginx/http-ddos-limits.conf)
#   3. Подключить секреты (токен prerender, не в git):
#        include /etc/nginx/snippets/svoygarage-secrets.conf;
#      (см. docs/nginx/svoygarage-secrets.conf.example)
#   4. Задать PRERENDER_INTERNAL_TOKEN в backend/.env (то же значение, что в secrets)
#   5. Backend с GET /api/public/page-check
#   6. Frontend build в /var/www/my-autoparts (включая 404.html, robots.txt)
#   sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

# ==============================================================================
# HTTPS (Port 443) - svoygarage.ru (ОСНОВНОЙ ДОМЕН)
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name svoygarage.ru;

    ssl_certificate /etc/nginx/ssl/svoygarage.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/svoygarage.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 60s;

    access_log /var/log/nginx/svoygarage_ssl_access.log;
    error_log /var/log/nginx/svoygarage_ssl_error.log;

    # --------------------------------------------------------------------------
    # Сжатие текстовой статики (JS/CSS/JSON/SVG/woff2). Не сжимать jpeg/png/webp.
    # Brotli: включить после проверки: nginx -V 2>&1 | grep -i brotli
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Brotli: на prod (2026-06) модуль не установлен — см. docs/ops/performance.md
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # --------------------------------------------------------------------------
    # Internal: prerender и page-check
    # --------------------------------------------------------------------------
    location = /_internal/page-prerender {
        internal;
        proxy_pass http://127.0.0.1:8080/api/public/page-prerender$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Prerender-Token $sg_prerender_token;
        proxy_read_timeout 60s;
    }

    location = /_internal/part-prerender {
        internal;
        proxy_pass http://127.0.0.1:8080/api/public/part-prerender$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Prerender-Token $sg_prerender_token;
        proxy_read_timeout 60s;
    }

    location = /_internal/new-part-prerender {
        internal;
        proxy_pass http://127.0.0.1:8080/api/public/new-part-prerender$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Prerender-Token $sg_prerender_token;
        proxy_read_timeout 60s;
    }

    location = /_internal/find-prerender {
        internal;
        proxy_pass http://127.0.0.1:8080/api/public/find-prerender$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Prerender-Token $sg_prerender_token;
        proxy_read_timeout 60s;
    }

    location = /_internal/page-check {
        internal;
        proxy_cache sg_page_check_cache;
        proxy_cache_valid 200 404 120s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$arg_path";
        proxy_pass http://127.0.0.1:8080/api/public/page-check$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Prerender-Token $sg_prerender_token;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # SEO: статические страницы — HTML с meta для ботов ($is_search_bot из map)
    # --------------------------------------------------------------------------
    location = /autoservice {
        return 301 /about;
    }

    location = /contacts {
        return 301 /about;
    }

    location = / {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /catalog {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /find {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/find-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /about {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /delivery {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /organizations {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /autoparts {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /payment {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /reviews {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /cookie-policy {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /privacy {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /offer {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /personal-data-consent {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/organizations/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/(new|used)$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/new/brand/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/new/category/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/used/brand/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/used/category/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/used/geo/[^/]+$ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/seller/part-card/ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/page-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/part/ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/part-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/new/part/\d+ {
        root /var/www/my-autoparts;
        if ($is_search_bot) {
            rewrite ^ /_internal/new-part-prerender?path=$request_uri last;
        }
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # SEO: динамический sitemap index
    # --------------------------------------------------------------------------
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080/api/feeds/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/feeds/sitemap-profiles.xml {
        return 410;
    }

    location ^~ /api/feeds/ {
        proxy_pass http://127.0.0.1:8080/api/feeds/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # --------------------------------------------------------------------------
    # React Frontend (SPA)
    # --------------------------------------------------------------------------
    location ~ ^/catalog/ {
        root /var/www/my-autoparts;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/autoparts/ {
        root /var/www/my-autoparts;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(delivery|payment|privacy|offer|cookie-policy|personal-data-consent|reviews|organizations|users|buyer|cart|order-reg|auth|product-not-found)(/|$) {
        root /var/www/my-autoparts;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/seller(/|$) {
        root /var/www/my-autoparts;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /var/www/my-autoparts;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        auth_request /_internal/page-check?path=$request_uri;
        error_page 401 403 =404 /404.html;
        root /var/www/my-autoparts;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        root /var/www/my-autoparts;
        add_header Cache-Control "no-cache" always;
    }

    location = /404.html {
        root /var/www/my-autoparts;
        internal;
        default_type text/html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|txt|xml|json|webmanifest)$ {
        root /var/www/my-autoparts;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------------------------
    # DDoS: закрыть прямой доступ к prerender/page-check (только nginx internal)
    # --------------------------------------------------------------------------
    location ~ ^/api/public/(page-prerender|part-prerender|new-part-prerender|find-prerender)$ {
        deny all;
        return 403;
    }

    location = /api/public/page-check {
        deny all;
        return 403;
    }

    location ~ ^/server/api/public/(page-prerender|part-prerender|new-part-prerender|find-prerender)$ {
        deny all;
        return 403;
    }

    location = /server/api/public/page-check {
        deny all;
        return 403;
    }

    # --------------------------------------------------------------------------
    # WebSocket чат
    # --------------------------------------------------------------------------
    location /server/ws/ {
        limit_req zone=sg_ws burst=20 nodelay;
        limit_conn sg_conn 10;
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /server/api/printers/ws {
        limit_req zone=sg_ws burst=20 nodelay;
        limit_conn sg_conn 10;
        proxy_pass http://127.0.0.1:8080/api/printers/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /server/uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /server/api/catalog/ {
        limit_req zone=sg_api burst=60 nodelay;
        limit_conn sg_conn 40;
        proxy_cache sg_api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8080/api/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /server/api/products/public/ {
        limit_req zone=sg_api burst=60 nodelay;
        limit_conn sg_conn 40;
        proxy_cache sg_api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8080/api/products/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /server/api/public/part-meta {
        limit_req zone=sg_api burst=60 nodelay;
        proxy_cache sg_api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8080/api/public/part-meta$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /server/api/public/new-part-meta {
        limit_req zone=sg_api burst=60 nodelay;
        proxy_cache sg_api_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8080/api/public/new-part-meta$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/server/api/feeds/(sitemap.*\.xml)$ {
        limit_req zone=sg_api burst=30 nodelay;
        proxy_cache sg_api_cache;
        proxy_cache_valid 200 3600s;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8080/api/feeds/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /server/api/auth/ {
        limit_conn sg_conn 40;
        proxy_pass http://127.0.0.1:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }

    location /server/api/ {
        limit_req zone=sg_api burst=60 nodelay;
        limit_conn sg_conn 40;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
    }

    location /server/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /api/printers/ws {
        limit_req zone=sg_ws burst=20 nodelay;
        limit_conn sg_conn 10;
        proxy_pass http://127.0.0.1:8080/api/printers/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /api/auth/ {
        limit_conn sg_conn 40;
        proxy_pass http://127.0.0.1:8080/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=sg_api burst=60 nodelay;
        limit_conn sg_conn 40;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        limit_req zone=sg_ws burst=20 nodelay;
        limit_conn sg_conn 10;
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~ /\.(env|git|htaccess|htpasswd|sql|log|bak)$ {
        deny all;
        return 404;
    }
}

# ==============================================================================
# HTTPS (Port 443) - по IP
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name 195.24.65.251;

    ssl_certificate /etc/nginx/ssl/svoygarage.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/svoygarage.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    access_log /var/log/nginx/ip_ssl_access.log;
    error_log /var/log/nginx/ip_ssl_error.log;

    location /server/ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /server/api/printers/ws {
        proxy_pass http://127.0.0.1:8080/api/printers/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ^~ /server/uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /server/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /server/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        alias /home/fast/autoparts/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
