# ==============================================================================
# Brotli (опционально). Подключать в server {} ПОСЛЕ установки модуля:
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   include /etc/nginx/snippets/svoygarage-brotli.conf;
# ==============================================================================

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
