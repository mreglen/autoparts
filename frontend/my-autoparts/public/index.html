      #pwa-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        align-items: center;
        justify-content: center;
        background: #fefdfb;
        transition: opacity 0.25s ease, visibility 0.25s;
      }

      html.pwa-standalone #pwa-splash {
        display: flex;
      }

      #pwa-splash.pwa-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pwa-splash__brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }

      #pwa-splash img {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        animation: pwa-splash-pulse 1.4s ease-in-out infinite;
      }

      .pwa-splash__title {
        margin: 0;
        font-family: "Onest", system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #0f172a;
      }

      .pwa-splash__subtitle {
        margin: 0;
        font-family: "Onest", system-ui, sans-serif;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #64748b;
      }

      @keyframes pwa-splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.88; transform: scale(0.96); }
      }
    </style>
