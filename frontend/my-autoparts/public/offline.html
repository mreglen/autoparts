<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Нет сети — Свой Гараж</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fefdfb;
        color: #111827;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        text-align: center;
      }
      img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
        margin: 0 auto 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: #4b5563;
      }
      button {
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: none;
        border-radius: 0.625rem;
        background: #4f46e5;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/img/LogoWithoutBg.png" alt="" width="80" height="80" />
      <h1>Нет подключения к интернету</h1>
      <p>Проверьте Wi‑Fi или мобильную сеть и попробуйте снова.</p>
      <button type="button" onclick="window.location.reload()">Повторить</button>
    </div>
  </body>
</html>
