<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — страница не найдена | Свой Гараж</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%);
        color: #111827;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .box {
        max-width: 420px;
        text-align: center;
      }
      .code {
        display: inline-flex;
        width: 88px;
        height: 88px;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: #e0e7ff;
        color: #4338ca;
        font-size: 36px;
        font-weight: 700;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 24px;
        color: #4b5563;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>Запрошенная страница не существует или была удалена.</p>
      <a href="/">На главную</a>
    </div>
  </body>
</html>
