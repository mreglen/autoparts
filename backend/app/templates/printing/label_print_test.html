<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Label Test</title>
    <style>
      @page {
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .label {
        width: {{label_width_mm|default(58)}}mm;
        height: {{label_height_mm|default(38)}}mm;
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
      }

      .design {
        width: {{label_width_mm|default(58)}}mm;
        height: {{label_height_mm|default(38)}}mm;
        box-sizing: border-box;
        padding: 2mm 2.5mm;
      }

      .content {
        display: flex;
        align-items: center;
        gap: 3mm;
        height: 100%;
      }

      .left {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.2mm;
      }

      .qr {
        flex: 0 0 auto;
        width: 16mm;
        height: 16mm;
        display: block;
        object-fit: contain;
      }

      .right {
        flex: 0 0 auto;
        width: 17mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1mm;
      }

      .right-meta {
        width: 100%;
        text-align: center;
        font-size: 6.5pt;
        line-height: 1.1;
        white-space: nowrap;
      }

      .row {
        line-height: 1.2;
      }

      .title {
        font-size: 5.5pt;
        font-weight: 700;
        opacity: 0.8;
      }

      .value {
        font-size: 7.5pt;
        font-weight: 600;
        line-height: 1.2;
        word-break: break-word;
      }

      .value.small {
        font-size: 6.5pt;
      }

      .storage-grid {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        margin-top: 0.4mm;
      }

      .storage-grid th,
      .storage-grid td {
        border: 0.2mm solid #000;
        padding: 0.3mm 0.5mm;
        text-align: center;
        vertical-align: middle;
        line-height: 1.1;
        word-break: break-word;
      }

      .storage-grid th {
        font-size: 5pt;
        font-weight: 700;
      }

      .storage-grid td {
        font-size: 6pt;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="label">
      <div class="design" id="design">
        <div class="content">
          <div class="left">
            <div class="row">
              <div class="title">Бренд</div>
              <div class="value">{{brand}}</div>
            </div>

            <div class="row">
              <div class="title">Артикул</div>
              <div class="value">{{article}}</div>
            </div>

            <div class="row">
              <div class="title">Адресное хранение</div>
              <table class="storage-grid">
                <tr>
                  {% for cell in storage_cells %}
                  <th>{{ cell.name_short }}</th>
                  {% endfor %}
                </tr>
                <tr>
                  {% for cell in storage_cells %}
                  <td>{{ cell.value }}</td>
                  {% endfor %}
                </tr>
              </table>
            </div>

            <div class="row" style="margin-bottom: 0;">
              <div class="title">Наименование</div>
              <div class="value small">{{name}}</div>
            </div>
          </div>

          <div class="right">
            <img class="qr" src="{{qr_data_uri}}" alt="QR code" />
            <div class="right-meta">Цена: {{price|default("—")}}</div>
            <div class="right-meta">Код: {{internal_code|default("—")}}</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var label = document.querySelector(".label");
          var design = document.getElementById("design");
          if (!label || !design) return;

          var baseW = 58;
          var baseH = 38;

          var actualW = label.clientWidth;
          var actualH = label.clientHeight;

          var scaleX = actualW / (baseW * 3.78);
          var scaleY = actualH / (baseH * 3.78);
          var k = Math.min(scaleX, scaleY);

          if (!isFinite(k) || k <= 0 || k > 1.5) return;

          design.style.transformOrigin = "center center";
          design.style.transform = "scale(" + k.toFixed(4) + ")";
        } catch (e) {}
      })();
    </script>
  </body>
</html>
