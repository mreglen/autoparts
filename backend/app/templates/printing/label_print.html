<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Label</title>
    <style>
      @page {
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .label {
        width: {{label_width_mm|default(58)}}mm;
        height: {{label_height_mm|default(38)}}mm;
        box-sizing: border-box;
        border: 1px solid #000;
        overflow: hidden;
        position: relative;
      }

      .design {
        width: {{label_width_mm|default(58)}}mm;
        height: {{label_height_mm|default(38)}}mm;
        box-sizing: border-box;
        padding: 3mm 2.5mm;
        transform-origin: top left;
      }

      .content {
        display: flex;
        align-items: flex-start;
        gap: 4mm;
      }

      .left {
        flex: 1 1 auto;
        min-width: 0;
      }

      .qr {
        flex: 0 0 auto;
        width: 20mm;
        height: 20mm;
        background: #000;
      }

      .right {
        flex: 0 0 auto;
        width: 22mm;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .right-meta {
        margin-top: 2mm;
        width: 100%;
        text-align: center;
        font-size: 8pt;
        line-height: 1.1;
        white-space: nowrap;
      }

      .row {
        margin-bottom: 1.5mm;
      }

      .title {
        font-size: 7pt;
        font-weight: 700;
        line-height: 1.1;
      }

      .value {
        font-size: 9pt;
        font-weight: 400;
        line-height: 1.1;
        word-break: break-word;
      }

      .value.small {
        font-size: 8pt;
      }
    </style>
  </head>
  <body>
    <div class="label">
      <div class="design" id="design">
        <div class="content">
          <div class="left">
            <div class="row">
              <div class="title">Бренд</div>
              <div class="value">{{brand}}</div>
            </div>

            <div class="row">
              <div class="title">Артикул</div>
              <div class="value">{{article}}</div>
            </div>

            <div class="row">
              <div class="title">Адресное хранение</div>
              <div class="value small">{{storage_address}}</div>
            </div>

            <div class="row" style="margin-bottom: 0;">
              <div class="title">Наименование</div>
              <div class="value small">{{name}}</div>
            </div>
          </div>

          <div class="right">
            <div class="qr" aria-label="QR placeholder"></div>
            <div class="right-meta">Цена: {{price|default("—")}}</div>
            <div class="right-meta">Код: {{internal_code|default("—")}}</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var label = document.querySelector(".label");
          var design = document.getElementById("design");
          if (!label || !design) return;
          
          var lw = label.clientWidth;
          var lh = label.clientHeight;
          var dw = design.offsetWidth;
          var dh = design.offsetHeight;
          if (!lw || !lh || !dw || !dh) return;
          
          // Масштабируем дизайн под фактический размер этикетки
          var k = Math.min(lw / dw, lh / dh);
          if (!isFinite(k) || k <= 0) return;
          design.style.transform = "scale(" + k + ")";
        } catch (e) {}
      })();
    </script>
  </body>
</html>
